version: "3.9"

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./app/data:/app/app/data

  frontend:
    image: node:20
    working_dir: /frontend
    command: sh -c "npm install && npm start"
    ports:
      - "3001:3000"
    volumes:
      - ./medical-dashboard:/frontend
    depends_on:
      - backend
